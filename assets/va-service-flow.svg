<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Illustrated customer support workflow">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17100d"/><stop offset="1" stop-color="#39261c"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1"><stop stop-color="#896044"/><stop offset=".5" stop-color="#e4bd96"/><stop offset="1" stop-color="#896044"/></linearGradient></defs>
<rect x="1" y="1" width="1098" height="278" rx="16" fill="url(#b)" stroke="#8e6245"/>
<text x="35" y="47" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#e3c29e">CUSTOMER SUPPORT · SERVICE WORKFLOW</text>
<text x="35" y="71" font-family="Arial,sans-serif" font-size="12" fill="#ae9480">How I approach customer concerns — illustrative process, not live analytics</text>
