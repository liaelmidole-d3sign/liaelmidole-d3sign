<g transform="translate(413 142)"><circle r="34" fill="#422c21" stroke="#e4bb95" stroke-width="2"/><text y="7" font-size="27" fill="#ffecd5">02</text><text y="68" font-weight="700" font-size="16" fill="#f9e0c2">REVIEW</text><text y="88" font-size="12" fill="#bda18b">Check the details</text></g>
<g transform="translate(685 142)"><circle r="34" fill="#422c21" stroke="#e4bb95" stroke-width="2"/><text y="7" font-size="27" fill="#ffecd5">03</text><text y="68" font-weight="700" font-size="16" fill="#f9e0c2">RESOLVE</text><text y="88" font-size="12" fill="#bda18b">Provide clear solutions</text></g>
<g transform="translate(956 142)"><circle r="34" fill="#422c21" stroke="#e4bb95" stroke-width="2"/><text y="7" font-size="27" fill="#ffecd5">04</text><text y="68" font-weight="700" font-size="16" fill="#f9e0c2">FOLLOW UP</text><text y="88" font-size="12" fill="#bda18b">Support to completion</text></g>
